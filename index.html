<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Save the Date - Maria Fernanda e Gustavo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page" aria-label="Save the date de Maria Fernanda e Gustavo">
      <section class="composition" aria-label="Composicao visual do convite">
        <img class="postcard postcard--decor postcard--decor-top" src="assets/postcard-atras.jpg" alt="" aria-hidden="true" />
        <img class="postcard postcard--decor postcard--decor-bottom" src="assets/postcard-atras.jpg" alt="" aria-hidden="true" />
        <article class="postcard postcard--main save-card" aria-label="Save the date para o casamento de Maria Fernanda e Gustavo, 10 de abril de 2027, Salao Verde, Clube Curitibano, as 14h30.">
          <img class="card-art card-art--left" src="assets/postcard-left.svg" alt="" aria-hidden="true" />
          <img class="card-art card-art--right" src="assets/postcard-right.svg" alt="" aria-hidden="true" />
          <button class="reminder-button" type="button" aria-label="Adicionar lembrete do casamento ao calendário">
            ADICIONAR LEMBRETE
          </button>
        </article>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
