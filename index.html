<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Save the Date - Maria Fernanda e Gustavo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page" aria-label="Save the date de Maria Fernanda e Gustavo">
      <section class="composition" aria-label="Composicao visual do convite">
        <img
          class="postcard postcard--decor postcard--decor-top"
          src="assets/postcard-atras.jpg"
          alt=""
          aria-hidden="true"
        />
        <img
          class="postcard postcard--decor postcard--decor-bottom"
          src="assets/postcard-atras.jpg"
          alt=""
          aria-hidden="true"
        />
        <article class="postcard postcard--main save-card" aria-label="Save the date para o casamento de Maria Fernanda e Gustavo, 10 de abril de 2027, Salao Verde, Clube Curitibano, as 14h30.">
          <div class="text-cover text-cover--title" aria-hidden="true"></div>
          <div class="text-cover text-cover--subtitle" aria-hidden="true"></div>
          <div class="text-cover text-cover--names" aria-hidden="true"></div>
          <div class="text-cover text-cover--date" aria-hidden="true"></div>
          <div class="text-cover text-cover--note" aria-hidden="true"></div>
          <div class="text-cover text-cover--room" aria-hidden="true"></div>
          <div class="text-cover text-cover--club" aria-hidden="true"></div>
          <div class="text-cover text-cover--address" aria-hidden="true"></div>
          <div class="text-cover text-cover--city" aria-hidden="true"></div>
          <div class="text-cover text-cover--time" aria-hidden="true"></div>

          <p class="card-text card-title">SAVE THE DATE</p>
          <p class="card-text card-subtitle">para o casamento de</p>
          <p class="card-text card-names">Maria Fernanda<br />e Gustavo</p>
          <p class="card-text card-date">10 DE ABRIL DE 2027</p>
          <p class="card-text card-note">convite oficial em breve</p>

          <p class="card-text card-room">Salão Verde</p>
          <p class="card-text card-club">Clube Curitibano</p>
          <p class="card-text card-address">AV. PRES. GETÚLIO VARGAS, 2857</p>
          <p class="card-text card-city">CURITIBA - PR</p>
          <p class="card-text card-time">às 14h30</p>
        </article>
      </section>
    </main>
  </body>
</html>
